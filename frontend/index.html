<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FictionRag | 无职转生 AI 助手</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app-shell" aria-label="FictionRag chat">
    <!-- Sidebar -->
    <aside class="sidebar parchment-panel" aria-label="Knowledge base">
      <section class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-0.5-5.5Z"/><path d="M8 7h6"/><path d="M8 11h8"/></svg>
        </div>
        <div>
          <h1>FictionRAG</h1>
          <p>无职转生 AI 助手</p>
        </div>
      </section>

      <div class="ornament-line" aria-hidden="true"></div>

      <section class="knowledge-picker" aria-label="Current knowledge base">
        <p class="section-label">当前知识库</p>
        <button type="button" class="book-select">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
          <span id="books-heading">同步中...</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </section>

      <section class="status-panel" aria-label="Retrieval settings">
        <div class="status-row">
          <span class="status-label">检索模式</span>
          <span class="status-value">Hybrid</span>
        </div>
        <div class="status-row">
          <span class="status-label">Top K</span>
          <span class="status-value" id="top-k-value">5</span>
        </div>
        <div class="status-row">
          <span class="status-label">重排序</span>
          <span class="status-value">Active</span>
        </div>
        <div class="status-row">
          <span class="status-label">体验次数</span>
          <span class="status-value" id="usage-status">同步中...</span>
        </div>
      </section>

      <section class="api-key-panel" aria-label="Custom Bailian API key">
        <p class="section-label">自定义 API Key</p>
        <input type="password" id="api-key-input" placeholder="填写阿里百炼 API Key" autocomplete="off" aria-label="阿里百炼 API Key">
        <div class="api-key-actions">
          <label class="remember-key">
            <input type="checkbox" id="remember-api-key">
            <span>记住</span>
          </label>
          <button type="button" id="verify-api-key">确认</button>
        </div>
        <a class="api-key-link" href="https://bailian.console.aliyun.com/cn-beijing/?tab=model#/api-key" target="_blank" rel="noopener noreferrer">申请百炼 API Key</a>
        <p class="api-key-status" id="api-key-status">未启用时使用每日免费体验次数。</p>
      </section>

      <section class="books-panel" aria-label="Loaded books">
        <p class="section-label">书库索引</p>
        <ul id="books-list">
          <li>加载中...</li>
        </ul>
        <p class="index-path" id="index-path-value" style="display: none;">data/index/chunks.jsonl</p>
      </section>

      <div class="sidebar-motto" aria-hidden="true">
        <p>「 探寻文字间的深意 」</p>
      </div>

      <div class="sidebar-actions">
        <button type="button" id="reset-button">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
          <span>重置</span>
        </button>
        <button type="button" id="export-button">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
          <span>导出</span>
        </button>
      </div>
    </aside>

    <!-- Chat Panel -->
    <section class="chat-panel parchment-panel" aria-label="Conversation">
      <header class="panel-heading">
        <h2>对话详情</h2>
        <p id="chat-subtitle">AI 正在为您解析文本</p>
      </header>

      <figure class="character-standee" aria-hidden="true">
        <img src="assets/character.png" alt="">
      </figure>

      <div class="conversation" id="conversation" aria-live="polite">
        <article class="message message-assistant">
          <div class="assistant-seal" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
          </div>
          <div class="bubble">
            <p>你好，我是你的无职转生 AI 助手，可以基于原文回答关于《无职转生》的各种问题。</p>
          </div>
        </article>
      </div>

      <form class="composer" id="composer" aria-label="Question composer">
        <textarea id="question" rows="1" placeholder="在此输入您的问题..." aria-label="输入问题"></textarea>
        <button type="submit" id="send-button" aria-label="发送">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        </button>
      </form>
    </section>

    <!-- References Panel -->
    <aside class="references parchment-panel" aria-label="Retrieved references">
      <header class="reference-heading">
        <h2 id="references-heading">关联片段</h2>
      </header>

      <div class="reference-list" id="reference-list">
        <article class="reference-card empty">
          <p>召回片段将在此处显示</p>
        </article>
      </div>

      <footer class="reference-footnote">
        基于深度语义向量检索
      </footer>
    </aside>
  </main>

  <!-- Modal -->
  <div class="modal-backdrop" id="reference-modal" hidden>
    <article class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button type="button" class="modal-close" id="modal-close" aria-label="关闭">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
      <span class="modal-book" id="modal-book">原文依据</span>
      <h2 id="modal-title">内容详情</h2>
      <div class="modal-meta" id="modal-meta"></div>
      <div class="modal-text" id="modal-text"></div>
    </article>
  </div>
</body>
</html>
